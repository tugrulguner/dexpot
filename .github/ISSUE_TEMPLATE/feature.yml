name: "Feature request"
description: "Propose a scoped dexpot capability or contract change"
title: "[Feature]: "
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the API. Substantial handler, routing, parser, scheduler, protocol, or execution-model changes need contract alignment before implementation. Early ideas belong in [Ideas](https://github.com/tugrulguner/dexpot/discussions/categories/ideas).

  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What concrete user problem should dexpot solve?"
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: "What happens now"
      description: "Describe current dexpot behavior and the limitation it creates."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Why I want it"
      description: "Why does this matter in a real synchronous API application or operational workflow?"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: "Concrete use case"
      description: "Show the smallest realistic application, request, and expected response that need this capability."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Public handler or routing API"
        - "HTTP parsing or protocol behavior"
        - "Scheduler or execution model"
        - "CLI and developer tooling"
        - "Documentation or runnable examples"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: proposed-contract
    attributes:
      label: "Proposed contract"
      description: "Describe the smallest public behavior that would solve the problem. Code is optional."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "List observable outcomes as Markdown checkboxes, including real socket or subprocess behavior where applicable."
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: open-question
    attributes:
      label: "Open question"
      description: "Name the most important contract or scope decision that still needs maintainer input."

  - type: textarea
    id: implementation-notes
    attributes:
      label: "Implementation notes"
      description: "Explain WHERE this belongs, HOW it crosses registration, compiled route, request, scheduler, and response boundaries, and which DEPENDENCIES or platform constraints matter."

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Describe current workarounds or smaller approaches and why they are insufficient."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "Scope and non-goals"
      description: "What should this proposal deliberately not change?"
    validations:
      required: true

  - type: dropdown
    id: contribution-intent
    attributes:
      label: "Contribution intent"
      description: "Tell maintainers whether you want to implement the agreed contract."
      options:
        - "I would like to implement this after contract alignment"
        - "I can help test the implementation"
        - "I am proposing the feature only"
        - "I need guidance before deciding"
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: "Confirmations"
      options:
        - label: "I searched existing issues, pull requests, Discussions, and the roadmap for this request."
          required: true
        - label: "I will wait for contract alignment before implementing a substantial change."
          required: true
