name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src/ tests/ examples/ scripts/
      - run: uv run ruff format --check src/ tests/ examples/ scripts/

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-extras --locked
      - run: uv run pyright src/ tests/ examples/ scripts/

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - name: Verify unforced runtime lifecycle
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          if [[ "$EXPECTED_PYTHON" == *t ]]; then
            uv run python scripts/verify_runtime_mode.py --expect ft --negative-extension
          else
            uv run python scripts/verify_runtime_mode.py --expect gil
          fi
      - run: >-
          uv run pytest tests/ -v
          --cov=src/dexpot
          --cov-report=term-missing
          --cov-fail-under=65

  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:playground
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Verify distribution artifacts
        run: |
          python3 - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              for required in (
                  "dexpot/__init__.py",
                  "dexpot/templates/skills/dexpot.md",
              ):
                  assert required in names, f"{required} missing from wheel"

          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              assert not any("/native/" in name for name in names), (
                  "dexpot sdist must not bundle the separate native distribution"
              )
              for suffix in (
                  "/src/dexpot/__init__.py",
                  "/README.md",
                  "/ROADMAP.md",
                  "/CONTRIBUTING.md",
              ):
                  assert any(name.endswith(suffix) for name in names), (
                      f"{suffix} missing from sdist"
                  )

          print(f"verified {wheels[0]} and {sdists[0]}")
          PY
      - name: Smoke the installed wheel, CLI, and every example
        run: |
          set -euo pipefail
          wheel="$(printf '%s\n' dist/*.whl)"
          uv venv --python 3.13 .artifact-smoke
          uv pip install --python .artifact-smoke/bin/python "${wheel}[cli]"
          .artifact-smoke/bin/python scripts/smoke_installed_examples.py
