name: Lifecycle macOS observer qualification

on:
  push:
    branches: [diagnostic/lifecycle-placement-probe]
    paths: [benchmarks/macos-observer-run-request.json]

permissions:
  contents: read

concurrency:
  group: lifecycle-macos-observer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Fresh macOS complete controls then candidate and enabled gates
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14.7"
          enable-cache: false
      - name: Install unchanged qualification dependencies
        run: |
          set -euo pipefail
          uv python install 3.14.7 3.14.7t
          HOMEBREW_NO_AUTO_UPDATE=1 brew install wrk
          uv venv --python 3.14.7 "$RUNNER_TEMP/qualification-driver"
          uv pip install --python "$RUNNER_TEMP/qualification-driver/bin/python" psutil==7.2.2 pytest==9.1.1 msgspec==0.22.0
      - name: Test orchestration and placement invariants
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qualification-driver/bin/python" -m pytest tests/test_process_observer.py tests/test_placement_probe.py tests/test_controlled_runner_stages.py tests/test_controlled_runner_platform.py -q -o addopts=''
          "$RUNNER_TEMP/qualification-driver/bin/python" scripts/controlled_lifecycle_qualification.py --self-test
      - name: Run original sequential gates without retries or request instrumentation
        run: '"$RUNNER_TEMP/qualification-driver/bin/python" scripts/controlled_lifecycle_qualification.py'
      - name: Preserve every adverse and invalid observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-macos-observer-evidence
          path: ${{ runner.temp }}/dexpot-lifecycle-qualification/evidence
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve exact measured wheels
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-macos-observer-wheels
          path: |
            ${{ runner.temp }}/dexpot-lifecycle-qualification/dist-main
            ${{ runner.temp }}/dexpot-lifecycle-qualification/dist-pr
          retention-days: 14
          if-no-files-found: warn
