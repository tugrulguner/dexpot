name: Lifecycle disjoint mixed stage diagnostic

on:
  push:
    branches: [diagnostic/lifecycle-placement-probe]
    paths: [benchmarks/stage-run-request.json]

permissions:
  contents: read

concurrency:
  group: lifecycle-placement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  placement:
    name: Sampled stage attribution on the losing FT mixed workload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14.7"
          enable-cache: false
      - name: Install unchanged ordinary benchmark dependencies
        run: |
          set -euo pipefail
          uv python install 3.14.7 3.14.7t
          sudo apt-get update
          sudo apt-get install -y wrk
          uv venv --python 3.14.7 "$RUNNER_TEMP/placement-driver"
          uv pip install --python "$RUNNER_TEMP/placement-driver/bin/python" psutil==7.2.2 pytest==9.1.1 msgspec==0.22.0
      - name: Test diagnostic scope and placement invariants
        run: >-
          "$RUNNER_TEMP/placement-driver/bin/python" -m pytest
          tests/test_placement_probe.py tests/test_lifecycle_stage_probe.py tests/test_controlled_runner_stages.py -q -o addopts=''
      - name: Collect predeclared cohorts without retries
        env:
          DEXPOT_DISJOINT_CONTROL: "1"
          DEXPOT_STAGE_DIAGNOSTIC: "1"
        run: '"$RUNNER_TEMP/placement-driver/bin/python" scripts/controlled_lifecycle_qualification.py'
      - name: Preserve invalid and adverse results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-disjoint-stage-evidence
          path: ${{ runner.temp }}/dexpot-lifecycle-qualification/evidence
          retention-days: 14
          if-no-files-found: warn
