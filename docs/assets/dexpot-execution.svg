<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">Dexpot compiles one endpoint plan with msgspec codecs and adapts scheduling to CPython</title>
  <desc id="desc">A typed route declaration compiles into an immutable endpoint plan. In automatic mode, each bounded request head uses a compatible Rust and PyO3 dexpot-native parser, or the Python reference when native is absent; Python mode forces the reference parser, and incompatible or broken native installations fail visibly. Execution then uses either a free-threaded connection-owned thread or a GIL bounded worker pool with optional process fan-out. Both run the same synchronous Python handler and msgspec response path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050817"/>
      <stop offset="0.52" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#070b19"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="45%" cy="42%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="68%" cy="55%" r="48%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#253250" stroke-width="1" opacity="0.28"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="cyanArrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L15 8L1 15Z" fill="#22d3ee"/>
    </marker>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L15 8L1 15Z" fill="#60a5fa"/>
    </marker>
    <marker id="amberArrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L15 8L1 15Z" fill="#fbbf24"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 28px; font-weight: 800; letter-spacing: 7px; }
      .headline { font-size: 58px; font-weight: 800; letter-spacing: -1px; }
      .subtitle { font-size: 30px; fill: #94a3b8; }
      .card-label { font-size: 28px; font-weight: 800; letter-spacing: 4px; }
      .card-title { font-size: 34px; font-weight: 750; fill: #f8fafc; }
      .body { font-size: 28px; fill: #cbd5e1; }
      .small { font-size: 28px; fill: #94a3b8; }
      .code { font-size: 28px; font-weight: 650; fill: #f8fafc; }
      .chip { font-size: 28px; font-weight: 750; fill: #e2e8f0; letter-spacing: 1px; }
      .flow-label { font-size: 28px; font-weight: 800; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="2400" height="1350" rx="42" fill="url(#bg)"/>
  <rect width="2400" height="1350" rx="42" fill="url(#grid)"/>
  <rect width="2400" height="1350" rx="42" fill="url(#cyanGlow)"/>
  <rect width="2400" height="1350" rx="42" fill="url(#amberGlow)"/>
  <rect x="2" y="2" width="2396" height="1346" rx="40" fill="none" stroke="#334155" stroke-width="3"/>

  <text x="1200" y="82" text-anchor="middle" class="sans eyebrow" fill="#fbbf24">ONE ENDPOINT PLAN · TWO RUNTIME PATHS</text>
  <text x="1200" y="158" text-anchor="middle" class="sans headline" fill="#f8fafc">Plain Python handlers · msgspec codecs · interpreter-aware scheduling.</text>
  <text x="1200" y="211" text-anchor="middle" class="sans subtitle">Registration compiles the work. Requests execute without an async bridge.</text>

  <!-- arrows behind cards -->
  <path d="M585 498H786" fill="none" stroke="#22d3ee" stroke-width="7" marker-end="url(#cyanArrow)"/>
  <text x="680" y="466" text-anchor="middle" class="sans flow-label" fill="#67e8f9">COMPILE</text>

  <path d="M1195 466C1298 466 1314 385 1410 385" fill="none" stroke="#60a5fa" stroke-width="7" marker-end="url(#blueArrow)"/>
  <text x="1298" y="392" text-anchor="middle" class="sans flow-label" fill="#93c5fd">NO GIL</text>

  <path d="M1195 590C1298 590 1314 735 1410 735" fill="none" stroke="#fbbf24" stroke-width="7" marker-end="url(#amberArrow)"/>
  <text x="1298" y="700" text-anchor="middle" class="sans flow-label" fill="#fde68a">GIL</text>

  <path d="M1980 385C2100 385 2080 602 2162 602" fill="none" stroke="#60a5fa" stroke-width="7" marker-end="url(#blueArrow)"/>
  <path d="M1980 735C2100 735 2080 642 2162 642" fill="none" stroke="#fbbf24" stroke-width="7" marker-end="url(#amberArrow)"/>

  <!-- declaration card -->
  <g filter="url(#shadow)">
    <rect x="90" y="300" width="495" height="445" rx="30" fill="#0b1727" stroke="#22d3ee" stroke-width="4"/>
    <circle cx="136" cy="354" r="11" fill="#22d3ee" filter="url(#softGlow)"/>
    <text x="164" y="364" class="sans card-label" fill="#67e8f9">DECLARE ONCE</text>
    <text x="136" y="424" class="sans card-title">Typed route + handler</text>
    <rect x="118" y="466" width="449" height="76" rx="16" fill="#050817" stroke="#164e63" stroke-width="2"/>
    <text x="132" y="514" class="mono code">@app.get("/items/{id}")</text>
    <text x="136" y="596" class="mono body">def get_item(id: int):</text>
    <text x="168" y="637" class="mono body">return Item(...)</text>
    <line x1="136" y1="678" x2="539" y2="678" stroke="#334155" stroke-width="2"/>
    <text x="136" y="716" class="sans small">sync callable · msgspec</text>
  </g>

  <!-- endpoint plan card -->
  <g filter="url(#shadow)">
    <rect x="800" y="274" width="395" height="500" rx="34" fill="#10152e" stroke="#a78bfa" stroke-width="4"/>
    <text x="998" y="330" text-anchor="middle" class="sans card-label" fill="#c4b5fd">IMMUTABLE PLAN</text>
    <circle cx="998" cy="404" r="54" fill="#0c4a6e" stroke="#22d3ee" stroke-width="5"/>
    <path d="M970 404h56M998 376v56" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <text x="998" y="494" text-anchor="middle" class="sans card-title">Compiled Route</text>
    <rect x="830" y="535" width="336" height="50" rx="25" fill="#050817" stroke="#6d5bd0" stroke-width="2"/>
    <text x="998" y="568" text-anchor="middle" class="mono chip">literal + params</text>
    <rect x="830" y="603" width="336" height="50" rx="25" fill="#050817" stroke="#6d5bd0" stroke-width="2"/>
    <text x="998" y="636" text-anchor="middle" class="mono chip">argument bindings</text>
    <rect x="830" y="671" width="336" height="50" rx="25" fill="#050817" stroke="#6d5bd0" stroke-width="2"/>
    <text x="998" y="704" text-anchor="middle" class="mono chip">body + response</text>
  </g>

  <!-- free-threaded lane -->
  <g filter="url(#shadow)">
    <rect x="1410" y="272" width="570" height="270" rx="30" fill="#0b1a2d" stroke="#60a5fa" stroke-width="4"/>
    <circle cx="1458" cy="328" r="11" fill="#60a5fa" filter="url(#softGlow)"/>
    <text x="1488" y="338" class="sans card-label" fill="#93c5fd">FREE-THREADED CPYTHON</text>
    <text x="1458" y="403" class="sans card-title">Connection-owned thread</text>
    <text x="1458" y="452" class="sans body">One process · shared in-process state</text>
    <text x="1458" y="494" class="sans small">Handlers can run in parallel</text>
  </g>

  <!-- GIL lane -->
  <g filter="url(#shadow)">
    <rect x="1410" y="605" width="570" height="300" rx="30" fill="#21180a" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="1458" cy="661" r="11" fill="#fbbf24" filter="url(#softGlow)"/>
    <text x="1488" y="671" class="sans card-label" fill="#fde68a">STANDARD GIL CPYTHON</text>
    <text x="1458" y="736" class="sans card-title">Bounded worker pool</text>
    <text x="1458" y="785" class="sans body">Finite queue · fast 503 overload shedding</text>
    <text x="1458" y="827" class="sans small">Optional POSIX process fan-out</text>
    <rect x="1458" y="848" width="270" height="44" rx="22" fill="#050817" stroke="#f59e0b" stroke-width="2"/>
    <text x="1593" y="879" text-anchor="middle" class="mono chip">DEXPOT_WORKERS</text>
  </g>

  <!-- shared execution card -->
  <g filter="url(#shadow)">
    <rect x="2160" y="350" width="150" height="550" rx="32" fill="#081a1c" stroke="#34d399" stroke-width="4"/>
    <text x="2235" y="565" text-anchor="middle" class="sans card-label" fill="#6ee7b7" transform="rotate(90 2235 565)">SAME PYTHON HANDLER</text>
    <circle cx="2235" cy="812" r="34" fill="#064e3b" stroke="#34d399" stroke-width="4"/>
    <path d="M2218 812l12 12 24-28" fill="none" stroke="#a7f3d0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- execution pipeline -->
  <g filter="url(#shadow)">
    <rect x="150" y="985" width="2100" height="250" rx="34" fill="#080d1c" stroke="#334155" stroke-width="3"/>
    <text x="1200" y="1038" text-anchor="middle" class="sans card-label" fill="#94a3b8">BOUNDED HTTP/1.x EXECUTION</text>

    <rect x="180" y="1073" width="520" height="126" rx="20" fill="#0b1727" stroke="#22d3ee" stroke-width="3"/>
    <text x="440" y="1112" text-anchor="middle" class="sans body">bound + parse request head</text>
    <text x="440" y="1150" text-anchor="middle" class="sans small" fill="#67e8f9">auto: compatible Rust / PyO3</text>
    <text x="440" y="1183" text-anchor="middle" class="sans small">absent or forced: Python</text>
    <path d="M700 1136H740" stroke="#22d3ee" stroke-width="5" marker-end="url(#cyanArrow)"/>

    <rect x="750" y="1098" width="400" height="76" rx="20" fill="#10152e" stroke="#a78bfa" stroke-width="3"/>
    <text x="950" y="1145" text-anchor="middle" class="sans body">match + bind + decode</text>
    <path d="M1150 1136H1190" stroke="#a78bfa" stroke-width="5" marker-end="url(#blueArrow)"/>

    <rect x="1200" y="1098" width="370" height="76" rx="20" fill="#081a1c" stroke="#34d399" stroke-width="3"/>
    <text x="1385" y="1145" text-anchor="middle" class="sans body">plain Python handler</text>
    <path d="M1570 1136H1610" stroke="#34d399" stroke-width="5" marker-end="url(#amberArrow)"/>

    <rect x="1620" y="1098" width="580" height="76" rx="20" fill="#21180a" stroke="#fbbf24" stroke-width="3"/>
    <text x="1910" y="1145" text-anchor="middle" class="sans body">msgspec encode + response</text>
  </g>

  <text x="1200" y="1290" text-anchor="middle" class="mono small" fill="#94a3b8">registration compiles · one live keep-alive connection owns one worker · requests execute synchronously</text>
</svg>
