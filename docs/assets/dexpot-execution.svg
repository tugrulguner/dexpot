<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120" role="img" aria-labelledby="title desc">
<title id="title">Dexpot registration, request parsing, scheduling and response flow</title>
<desc id="desc">Before listening, route registration compiles an immutable EndpointPlan; serving freezes the application and router plans. The interpreter-selected scheduler admits each connection before request parsing and route matching. Free-threaded: capped connection-owned threads. Standard GIL: bounded pool · optional POSIX processes. Auto: compatible Rust / PyO3 request-head parsing; Python if native absent or forced. Python owns sockets, bodies, deadlines, routing, synchronous handlers, checked output and writes. response=T validates and projects output before sending; response=None keeps generic JSON.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050817"/><stop offset="1" stop-color="#0a1230"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
<style>.sans{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}.title{font-size:58px;font-weight:750;fill:#f8fafc}.head{font-size:36px;font-weight:700;fill:#f8fafc}.label{font-size:32px;font-weight:700;letter-spacing:2px}.body{font-size:32px;fill:#e2e8f0}.small{font-size:32px;fill:#cbd5e1}.card{fill:#0c1427;stroke-width:3}.arrow{fill:none;stroke:#67e8f9;stroke-width:5;marker-end:url(#arrow)}</style>
</defs>
<rect width="2000" height="1120" rx="32" fill="url(#bg)"/>
<rect x="2" y="2" width="1996" height="1116" rx="30" fill="none" stroke="#334155" stroke-width="3"/>
<text x="1000" y="68" text-anchor="middle" class="sans label" fill="#fbbf24">ONE COMPILED APPLICATION · TWO INTERPRETER MODES</text>
<text x="1000" y="144" text-anchor="middle" class="sans title">From registration to a complete HTTP response</text>
<text x="1000" y="193" text-anchor="middle" class="sans body">Plain synchronous Python handlers, with bounded admission around them.</text>
<path d="M350 385V447" class="arrow"/>
<path d="M640 565H712" class="arrow"/>
<path d="M1260 565H1332" class="arrow"/>
<path d="M1640 690V735H600V797" class="arrow"/>
<path d="M880 905H1072" class="arrow"/>
<rect x="60" y="245" width="1880" height="140" rx="22" class="card" stroke="#22d3ee"/>
<text x="92" y="290" class="sans label" fill="#67e8f9">REGISTER + FREEZE · BEFORE LISTENING</text>
<text x="92" y="346" class="sans head">Compile immutable EndpointPlan; freeze application + router plans before serving.</text>
<rect x="60" y="455" width="580" height="235" rx="22" class="card" stroke="#60a5fa"/>
<text x="92" y="500" class="sans label" fill="#93c5fd">ADMIT + SCHEDULE</text>
<text x="92" y="553" class="sans body">Free-threaded: capped threads</text>
<text x="92" y="607" class="sans body">GIL: bounded pool + queue</text>
<text x="92" y="661" class="sans small">Optional POSIX processes (GIL)</text>
<rect x="720" y="455" width="540" height="235" rx="22" class="card" stroke="#a78bfa"/>
<text x="752" y="500" class="sans label" fill="#c4b5fd">BOUNDED INPUT</text>
<text x="752" y="553" class="sans head">Request-head parser</text>
<text x="752" y="607" class="sans body">Auto: compatible Rust / PyO3</text>
<text x="752" y="661" class="sans small">Python if native absent or forced</text>
<rect x="1340" y="455" width="600" height="235" rx="22" class="card" stroke="#34d399"/>
<text x="1372" y="500" class="sans label" fill="#6ee7b7">ROUTE + INPUT</text>
<text x="1372" y="553" class="sans head">Match · bind · decode</text>
<text x="1372" y="607" class="sans body">Frozen application/router plan</text>
<text x="1372" y="661" class="sans small">Convert captures; validate body</text>
<rect x="320" y="805" width="560" height="195" rx="22" class="card" stroke="#34d399"/>
<text x="352" y="850" class="sans label" fill="#6ee7b7">APPLICATION CODE</text>
<text x="352" y="905" class="sans head">Synchronous Python handler</text>
<text x="352" y="960" class="sans body">Return a value or envelope</text>
<rect x="1080" y="805" width="600" height="195" rx="22" class="card" stroke="#fbbf24"/>
<text x="1112" y="850" class="sans label" fill="#fde68a">RESPONSE</text>
<text x="1112" y="905" class="sans head">Prepare · encode · send</text>
<text x="1112" y="960" class="sans body">Declared output checked before send</text>
<text x="1000" y="1068" text-anchor="middle" class="sans small">Python owns sockets, deadlines, bodies, routing, handlers and writes. Rust remains parser-only.</text>
</svg>
