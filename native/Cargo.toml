[package]
name = "dexpot-native"
version = "0.0.0"
edition = "2024"
description = "Optional Rust HTTP parser acceleration for dexpot"
license = "MIT"
repository = "https://github.com/tugrulguner/dexpot"
exclude = ["dist*/", ".venv*/", "target/"]

[lib]
name = "_parser"
crate-type = ["cdylib"]

[features]
abi3 = ["pyo3/abi3-py312"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
