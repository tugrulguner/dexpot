[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "dexpot-native"
version = "0.1.0"
description = "Optional Rust HTTP parser acceleration for dexpot."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tugrul Guner", email = "tugrulgunr@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://github.com/tugrulguner/dexpot"
Repository = "https://github.com/tugrulguner/dexpot"
Issues = "https://github.com/tugrulguner/dexpot/issues/18"

[dependency-groups]
dev = [
  "dexpot==0.2.0",
  "pytest>=9",
  "pyright>=1.1.411",
  "ruff>=0.16",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "dexpot_native._parser"
python-source = "python"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["python", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
