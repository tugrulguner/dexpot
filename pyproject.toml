[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexpot"
version = "0.2.0"
description = "A synchronous Python API framework with adaptive GIL and free-threaded execution."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tugrul Guner", email = "tugrulgunr@gmail.com" }]
keywords = [
  "api",
  "framework",
  "free-threading",
  "http",
  "msgspec",
  "nogil",
  "threads",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "msgspec>=0.19",
]

[project.optional-dependencies]
cli = ["typer>=0.9"]
all = ["dexpot[cli]"]
dev = [
  "dexpot[all]",
  "httpx>=0.27",
  "pre-commit>=4.0",
  "pyright>=1.1.380",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.6",
  "towncrier>=24.8",
]

[project.urls]
Homepage = "https://github.com/tugrulguner/dexpot"
Repository = "https://github.com/tugrulguner/dexpot"
Issues = "https://github.com/tugrulguner/dexpot/issues"
Changelog = "https://github.com/tugrulguner/dexpot/blob/main/CHANGELOG.md"

[project.scripts]
dexpot = "dexpot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dexpot"]
exclude = ["**/AGENTS.md"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv*", "/dist", "/native"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/tugrulguner/dexpot/issues/{issue})"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples", "scripts"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  "B008", # Typer declares arguments and options through function defaults.
]

[tool.ruff.lint.isort]
known-first-party = ["dexpot"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "examples", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
