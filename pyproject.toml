[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexpot"
version = "0.1.0"
description = "A thread-per-request Python API framework built for free-threaded CPython."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tugrul Guner", email = "tugrulgunr@gmail.com" }]
keywords = ["http", "api", "framework", "free-threading", "nogil", "threads"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Free Threading",
  "Typing :: Typed",
]
dependencies = [
  "msgspec>=0.19",
]

[project.optional-dependencies]
cli = ["typer>=0.9"]
all = ["dexpot[cli]"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "towncrier>=24.8",
  "httpx>=0.27",
  "dexpot[all]",
]

[project.urls]
Homepage = "https://github.com/tugrulguner/dexpot"
Repository = "https://github.com/tugrulguner/dexpot"
Issues = "https://github.com/tugrulguner/dexpot/issues"

[project.scripts]
dexpot = "dexpot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dexpot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dexpot"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
